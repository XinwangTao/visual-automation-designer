[package]
name = "visual-automation-designer"
version = "1.0.5"
description = "Visual Automation Designer - A visual programming tool for screen automation"
authors = ["Visual Automation Designer Team"]
edition = "2021"
default-run = "visual-automation-designer"

[lib]
name = "visual_automation_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# AI-agent facing headless entry points. They share the library above; the
# Tauri GUI binary is unchanged.
[[bin]]
name = "vadctl"
path = "src/bin/vadctl.rs"

[[bin]]
name = "vad-mcp"
path = "src/bin/vad_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.24"
thiserror = "2"
async-trait = "0.1"
# Async utilities
futures = "0.3"
# Screen capture and input simulation
screenshots = "0.8"
enigo = "0.3"
# Logging
log = "0.4"
env_logger = "0.11"
# Base64 for clipboard images
base64 = "0.22"

# Windows OCR API (Windows-only, conditionally compiled)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Foundation",
    "Storage_Streams",
    "Foundation_Numerics",
    "Globalization",
    "implement",
    "Data_Xml_Dom",
    # UIA target discovery + window guards for headless automation
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
serial_test = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
